name: Verify bundled lm15

on:
  pull_request:
    paths:
      - 'AlinGo-Prompt/_vendor/**'
      - 'AlinGo-Prompt/lm15.py'
      - 'AlinGo-Prompt/__init__.py'
      - 'AlinGo-Prompt/clients/**'
      - 'pyproject.toml'
      - 'scripts/update_vendored_lm15.py'
      - 'tests/test_vendored_lm15.py'
      - 'tests/clients/**'
      - '.github/workflows/vendored_lm15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Build source distribution and wheel
        # By default, uv builds the wheel from the source distribution.
        run: uv build
      - name: Test the installed wheel outside the checkout
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/lm15-wheel-venv"
          uv pip install --python "$RUNNER_TEMP/lm15-wheel-venv/bin/python" dist/*.whl pytest
          "$RUNNER_TEMP/lm15-wheel-venv/bin/python" -I -c 'import importlib.util; assert importlib.util.find_spec("litellm") is None'
          mkdir "$RUNNER_TEMP/lm15-wheel-tests"
          cp tests/test_vendored_lm15.py "$RUNNER_TEMP/lm15-wheel-tests/"
          cd "$RUNNER_TEMP/lm15-wheel-tests"
          "$RUNNER_TEMP/lm15-wheel-venv/bin/python" -I -m pytest -q test_vendored_lm15.py
